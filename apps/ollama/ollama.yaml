apiVersion: v1
kind: Namespace
metadata:
  name: ai-services
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-hostpath-retain
  annotations:
    openebs.io/cas-type: "local-hostpath"
    cas.openebs.io/config: |
      - name: StorageType
        value: "hostpath"
      - name: BasePath
        value: "/var/openebs/local/"
provisioner: openebs.io/local
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---  
# Ollama 模型数据 PVC —— OpenEBS Local PV (Hostpath) 动态供给
# storageClassName: openebs-hostpath 由 OpenEBS helm 安装后自动创建
# 容量按需调整: qwen2.5:1.5b 约 1GB, 更大模型请加大 (如 100Gi)
# annotation: 防止 Argo CD automated.prune 误删 PVC (数据安全)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: ai-services
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: openebs-hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-services
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        # 显式声明模型目录 = 挂载点目录 (/root/.ollama 是官方镜像默认约定)
        - name: OLLAMA_MODELS
          value: /root/.ollama/models
        # 监听所有网卡: 保证 NodePort / 集群外(Agent 所在节点)访问可达
        - name: OLLAMA_HOST
          value: 0.0.0.0
        volumeMounts:
        # 把整个模型目录挂到 PVC 上: 模型随 Pod 重建/重启而保留
        - name: ollama-models
          mountPath: /root/.ollama
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: ai-services
spec:
  type: NodePort
  selector: { app: ollama }
  ports:
  - port: 11434
    targetPort: 11434
